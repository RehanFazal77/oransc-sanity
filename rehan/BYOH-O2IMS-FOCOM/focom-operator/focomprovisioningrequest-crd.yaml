apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: focomprovisioningrequests.focom.nephio.org
spec:
  group: focom.nephio.org
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Target O-Cloud
                oCloudId:
                  type: string
                  description: "ID of the target O-Cloud (management cluster identifier)"
                oCloudNamespace:
                  type: string
                  description: "Namespace in the O-Cloud for the ProvisioningRequest"
                  default: "default"
                name:
                  type: string
                  description: "Name for the provisioning request"
                description:
                  type: string
                  description: "Description of the provisioning request"
                
                # === Operation Type (Phase 2) ===
                operation:
                  type: string
                  description: "Type of operation: create, scale, upgrade, delete"
                  enum: ["create", "scale", "upgrade", "delete"]
                  default: "create"
                
                # === Draft/Execute Mode (Phase 2) ===
                mode:
                  type: string
                  description: "Request mode: draft (preview only) or execute (actually provision)"
                  enum: ["draft", "execute"]
                  default: "execute"
                
                approved:
                  type: boolean
                  description: "For draft mode - set to true to approve and execute"
                  default: false
                
                # === Rollback (Phase 2) ===
                rollbackToRevision:
                  type: integer
                  description: "Revision number to rollback to"
                
                # === Simplified Approaches (input.json based) ===
                
                # Option 1: Create ALL clusters from input.json
                allClusters:
                  type: boolean
                  description: "If true, create all clusters defined in input.json"
                  default: false
                
                # Option 2: Create specific clusters from input.json
                clusterNames:
                  type: array
                  description: "Array of cluster names to create from input.json"
                  items:
                    type: string
                
                # Option 3: Create single cluster from input.json
                clusterName:
                  type: string
                  description: "Single cluster name to create from input.json"
                
                # === Template-based Approach ===
                
                # Option 4: Use ClusterTemplate with full parameters
                templateName:
                  type: string
                  description: "Name of the cluster template"
                templateVersion:
                  type: string
                  description: "Version of the template"
                templateParameters:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: "Parameters for the cluster template"
                
                # === Scaling Parameters (Phase 2) ===
                targetWorkerCount:
                  type: integer
                  description: "Target number of worker nodes for scale operation"
                
                # === Upgrade Parameters (Phase 3) ===
                targetK8sVersion:
                  type: string
                  description: "Target Kubernetes version for upgrade operation"
            
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Loading", "Validating", "Checking", "Creating", "Scaling", "Upgrading", "Synced", "Failed", "Deleting", "Draft", "RollingBack"]
                message:
                  type: string
                lastUpdated:
                  type: string
                remoteName:
                  type: string
                  description: "Name(s) of the created ProvisioningRequest(s) in the O-Cloud"
                validation:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: "Validation results"
                feasibility:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: "Feasibility check results"
                # Phase 2: Versioning
                revision:
                  type: integer
                  description: "Current revision number"
                revisionHistory:
                  type: array
                  description: "List of revision numbers"
                  items:
                    type: integer
                # Phase 2: Scaling
                currentWorkerCount:
                  type: integer
                  description: "Current number of worker nodes"
                targetWorkerCount:
                  type: integer
                  description: "Target number of worker nodes"
                # Phase 2: Draft mode
                draftPreview:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: "Preview of what will be created in draft mode"
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Operation
          type: string
          jsonPath: .spec.operation
        - name: Remote
          type: string
          jsonPath: .status.remoteName
        - name: Revision
          type: integer
          jsonPath: .status.revision
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: focomprovisioningrequests
    singular: focomprovisioningrequest
    kind: FocomProvisioningRequest
    shortNames:
      - fpr
      - focomreq
