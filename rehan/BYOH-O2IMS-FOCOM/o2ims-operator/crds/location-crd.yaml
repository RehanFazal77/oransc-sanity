apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: locations.o2ims.provisioning.oran.org
spec:
  group: o2ims.provisioning.oran.org
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: "Human-readable location name"
                
                description:
                  type: string
                  description: "Location description"
                
                locationType:
                  type: string
                  enum: ["region", "datacenter", "zone", "rack", "edge-site"]
                  description: "Type of location"
                
                parentLocation:
                  type: string
                  description: "Name of parent location (for hierarchy)"
                
                geoCoordinates:
                  type: object
                  properties:
                    latitude:
                      type: number
                    longitude:
                      type: number
                  description: "Geographic coordinates"
                
                address:
                  type: object
                  properties:
                    country:
                      type: string
                    state:
                      type: string
                    city:
                      type: string
                    street:
                      type: string
                    postalCode:
                      type: string
                  description: "Physical address"
                
                # Host selection for this location
                hostSelector:
                  type: object
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                  description: "Labels to match hosts at this location"
                
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                  description: "Additional location metadata"
            
            status:
              type: object
              properties:
                hostCount:
                  type: integer
                  description: "Number of hosts at this location"
                clusterCount:
                  type: integer
                  description: "Number of clusters at this location"
                childLocations:
                  type: array
                  items:
                    type: string
                  description: "Child locations in hierarchy"
                availableHosts:
                  type: integer
                usedHosts:
                  type: integer
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.locationType
        - name: Parent
          type: string
          jsonPath: .spec.parentLocation
        - name: Hosts
          type: integer
          jsonPath: .status.hostCount
        - name: Clusters
          type: integer
          jsonPath: .status.clusterCount
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: locations
    singular: location
    kind: Location
    shortNames:
      - loc
