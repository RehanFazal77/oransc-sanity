apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: measurementjobs.o2ims.provisioning.oran.org
spec:
  group: o2ims.provisioning.oran.org
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - targets
                - metrics
              properties:
                targets:
                  type: object
                  properties:
                    clusterNames:
                      type: array
                      items:
                        type: string
                      description: "Cluster names to monitor"
                    hostNames:
                      type: array
                      items:
                        type: string
                      description: "Host names to monitor"
                    allClusters:
                      type: boolean
                      default: false
                      description: "Monitor all clusters"
                  description: "Monitoring targets"
                
                metrics:
                  type: array
                  items:
                    type: string
                    enum: ["cpu", "memory", "disk", "network", "pods", "nodes"]
                  description: "Metrics to collect"
                
                interval:
                  type: string
                  default: "60s"
                  description: "Collection interval"
                
                retention:
                  type: string
                  default: "24h"
                  description: "Data retention period"
                
                enabled:
                  type: boolean
                  default: true
                
                thresholds:
                  type: object
                  properties:
                    cpu:
                      type: object
                      properties:
                        warning:
                          type: integer
                          default: 70
                        critical:
                          type: integer
                          default: 90
                    memory:
                      type: object
                      properties:
                        warning:
                          type: integer
                          default: 80
                        critical:
                          type: integer
                          default: 95
                    disk:
                      type: object
                      properties:
                        warning:
                          type: integer
                          default: 80
                        critical:
                          type: integer
                          default: 95
                  description: "Threshold percentages for alarms"
            
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Running", "Stopped", "Failed"]
                lastCollection:
                  type: string
                collectionCount:
                  type: integer
                targetCount:
                  type: integer
                latestMetrics:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: "Latest collected metrics summary"
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Targets
          type: integer
          jsonPath: .status.targetCount
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Interval
          type: string
          jsonPath: .spec.interval
        - name: Last Collection
          type: string
          jsonPath: .status.lastCollection
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: measurementjobs
    singular: measurementjob
    kind: MeasurementJob
    shortNames:
      - pmjob
