apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: provisioningrevisions.o2ims.provisioning.oran.org
spec:
  group: o2ims.provisioning.oran.org
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - requestName
                - revision
              properties:
                requestName:
                  type: string
                  description: "Name of the FocomProvisioningRequest this revision belongs to"
                requestNamespace:
                  type: string
                  description: "Namespace of the FocomProvisioningRequest"
                  default: "default"
                revision:
                  type: integer
                  description: "Revision number (increments on each change)"
                createdAt:
                  type: string
                  description: "Timestamp when this revision was created"
                createdBy:
                  type: string
                  description: "User or system that created this revision"
                operation:
                  type: string
                  description: "Operation that created this revision"
                  enum: ["create", "scale", "upgrade", "rollback", "update"]
                message:
                  type: string
                  description: "Description of changes in this revision"
                
                # Snapshot of the spec at this revision
                specSnapshot:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: "Complete snapshot of the request spec at this revision"
                
                # Cluster state at this revision
                clusterState:
                  type: object
                  properties:
                    clusterName:
                      type: string
                    k8sVersion:
                      type: string
                    masterCount:
                      type: integer
                    workerCount:
                      type: integer
                    phase:
                      type: string
                  description: "State of the cluster at this revision"
            
            status:
              type: object
              properties:
                active:
                  type: boolean
                  description: "Whether this is the current active revision"
                rolledBackFrom:
                  type: integer
                  description: "If this revision was restored via rollback, the previous revision number"
                rolledBackAt:
                  type: string
                  description: "Timestamp when rollback was performed"
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Request
          type: string
          jsonPath: .spec.requestName
        - name: Revision
          type: integer
          jsonPath: .spec.revision
        - name: Operation
          type: string
          jsonPath: .spec.operation
        - name: Active
          type: boolean
          jsonPath: .status.active
        - name: Created
          type: string
          jsonPath: .spec.createdAt
  scope: Namespaced
  names:
    plural: provisioningrevisions
    singular: provisioningrevision
    kind: ProvisioningRevision
    shortNames:
      - prev
      - revision
