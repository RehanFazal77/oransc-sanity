apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: resourcepools.o2ims.provisioning.oran.org
spec:
  group: o2ims.provisioning.oran.org
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: "Human-readable name for the resource pool"
                description:
                  type: string
                  description: "Description of this resource pool"
                
                # Host selection criteria
                hostSelector:
                  type: object
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                      description: "Labels to match ByoHosts"
                    matchExpressions:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                          operator:
                            type: string
                            enum: ["In", "NotIn", "Exists", "DoesNotExist"]
                          values:
                            type: array
                            items:
                              type: string
                  description: "Selector for ByoHosts that belong to this pool"
                
                # Explicit host list (alternative to selector)
                hostIds:
                  type: array
                  items:
                    type: integer
                  description: "Explicit list of host_ids that belong to this pool"
                
                # Pool configuration
                location:
                  type: string
                  description: "Geographic location or datacenter"
                tier:
                  type: string
                  description: "Service tier (e.g., production, development, edge)"
                  enum: ["production", "development", "staging", "edge"]
                
                # Capacity limits
                maxHosts:
                  type: integer
                  description: "Maximum number of hosts in this pool"
                reservedHosts:
                  type: integer
                  description: "Number of hosts reserved for failover"
            
            status:
              type: object
              properties:
                totalHosts:
                  type: integer
                  description: "Total hosts matching selector"
                availableHosts:
                  type: integer
                  description: "Hosts not assigned to any cluster"
                usedHosts:
                  type: integer
                  description: "Hosts currently assigned to clusters"
                hostNames:
                  type: array
                  items:
                    type: string
                  description: "List of host names in this pool"
                lastUpdated:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Total
          type: integer
          jsonPath: .status.totalHosts
        - name: Available
          type: integer
          jsonPath: .status.availableHosts
        - name: Used
          type: integer
          jsonPath: .status.usedHosts
        - name: Tier
          type: string
          jsonPath: .spec.tier
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: resourcepools
    singular: resourcepool
    kind: ResourcePool
    shortNames:
      - rpool
