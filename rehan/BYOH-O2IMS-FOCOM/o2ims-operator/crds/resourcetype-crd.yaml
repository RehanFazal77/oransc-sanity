apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: resourcetypes.o2ims.provisioning.oran.org
spec:
  group: o2ims.provisioning.oran.org
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: "Human-readable name for the resource type"
                description:
                  type: string
                  description: "Description of this resource type"
                
                # Hardware specifications
                cpu:
                  type: object
                  properties:
                    cores:
                      type: integer
                      description: "Number of CPU cores"
                    architecture:
                      type: string
                      description: "CPU architecture (amd64, arm64)"
                      enum: ["amd64", "arm64"]
                    minCores:
                      type: integer
                      description: "Minimum required CPU cores"
                  description: "CPU specifications"
                
                memory:
                  type: object
                  properties:
                    size:
                      type: string
                      description: "Total memory (e.g., '16Gi')"
                    minSize:
                      type: string
                      description: "Minimum required memory"
                  description: "Memory specifications"
                
                storage:
                  type: object
                  properties:
                    size:
                      type: string
                      description: "Total disk size (e.g., '100Gi')"
                    type:
                      type: string
                      description: "Storage type"
                      enum: ["ssd", "hdd", "nvme"]
                    minSize:
                      type: string
                      description: "Minimum required disk size"
                  description: "Storage specifications"
                
                network:
                  type: object
                  properties:
                    interfaces:
                      type: integer
                      description: "Number of network interfaces"
                    bandwidth:
                      type: string
                      description: "Network bandwidth (e.g., '10Gbps')"
                  description: "Network specifications"
                
                # Capabilities
                capabilities:
                  type: array
                  items:
                    type: string
                  description: "Special capabilities (e.g., gpu, fpga, sriov)"
                
                # Labels to identify matching hosts
                matchLabels:
                  type: object
                  additionalProperties:
                    type: string
                  description: "Labels that hosts of this type should have"
            
            status:
              type: object
              properties:
                matchingHosts:
                  type: integer
                  description: "Number of hosts matching this type"
                hostNames:
                  type: array
                  items:
                    type: string
                  description: "List of host names matching this type"
                lastUpdated:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: CPU
          type: string
          jsonPath: .spec.cpu.cores
        - name: Memory
          type: string
          jsonPath: .spec.memory.size
        - name: Storage
          type: string
          jsonPath: .spec.storage.size
        - name: Matching
          type: integer
          jsonPath: .status.matchingHosts
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: resourcetypes
    singular: resourcetype
    kind: ResourceType
    shortNames:
      - rtype
